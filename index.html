<!doctype html>
<html lang="id"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="Falling Objects arcade game"/><title>Falling Objects</title></head>
<body><div id="app"><main class="game-container"><h1 class="game-heading">FALLING OBJECTS</h1>
<section id="lobby" class="panel"><h2>Siap bermain?</h2><p>Pilih nama pemain atau buat nama baru. Skor disimpan lokal di browser ini.</p><form id="login-form"><label for="player-name">Nama pemain</label><input id="player-name" maxlength="18" placeholder="Masukkan nama kamu" required/><button id="start-button" type="button">Mulai bermain</button></form><div class="row"><button id="leaderboard-button" class="secondary">Leaderboard lokal</button><button id="highscore-button" class="secondary">High score</button></div><div id="lobby-message" aria-live="polite"></div></section>
<section id="board-panel" class="panel hidden"><h2 id="board-title">Leaderboard lokal</h2><ol id="board-list"></ol><button id="board-back" class="secondary">Kembali</button></section>
<div id="game-wrap" class="hidden"><div id="game"></div><div class="game-help">Gerak: ← → atau A / D · Magnet: M · Kebal: I · Tombol spell juga tersedia di bawah game.</div><div class="inventory-label">INVENTARIS SPELL <span id="active-spell-status">Belum ada spell aktif</span></div><div class="spellbar"><button id="magnet-button" disabled><img class="spell-icon" src="/assets/images/power-magnet.png" alt=""/><span>Magnet <strong id="magnet-count">0 pcs</strong><small id="magnet-status">Tersedia: 0</small></span></button><button id="shield-button" disabled><img class="spell-icon" src="/assets/images/power-shield.png" alt=""/><span>Kebal <strong id="shield-count">0 pcs</strong><small id="shield-status">Tersedia: 0</small></span></button><button id="quit-button" class="secondary">Akhiri permainan</button></div><div class="mobile-controls" aria-label="Kontrol permainan untuk ponsel"><div class="move-pad"><button id="move-left" aria-label="Bergerak ke kiri">Kiri</button><button id="move-right" aria-label="Bergerak ke kanan">Kanan</button></div><div class="mobile-label">Kontrol sentuh</div><div class="mobile-spells"><button id="mobile-magnet"><img class="spell-icon" src="/assets/images/power-magnet.png" alt=""/> Magnet <span id="mobile-magnet-count">0 pcs</span></button><button id="mobile-shield"><img class="spell-icon" src="/assets/images/power-shield.png" alt=""/> Kebal <span id="mobile-shield-count">0 pcs</span></button></div></div></div>
<section id="result-panel" class="panel hidden"><h2>Game Over!</h2><p id="result-score"></p><p id="result-best"></p><button id="again-button">Main lagi</button><button id="menu-button" class="secondary">Menu utama</button></section>
</main></div><script type="module" src="/src/main.ts"></script></body></html>
